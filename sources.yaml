# 監視するキーワード設定 — ここを書き換えるだけで動作が変わります

# タイトルにこの語が「すべて」含まれるアイテムだけ新着表示の対象にします
include_keywords:
  - 動画

# タイトルにこの語が1つでも含まれていたら除外します(空 [] なら除外なし)
exclude_keywords: []

# 1回の実行で「新着」として記録する最大件数
max_items_per_run: 20

# ─────────────────────────────────────────────────────
# 監視するフィード。RSS(またはAtom)のURLを追加するだけで対象が増えます。
# URLが取れたら1〜2行で貼り付けてください。
# ─────────────────────────────────────────────────────
